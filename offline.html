<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — GDX</title>
  <meta name="theme-color" content="#050604">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2408, #050604 60%); color: #eef2e6;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .card { max-width: 380px; padding: 32px 26px; border-radius: 26px; background: rgba(255,255,255,.05); box-shadow: 0 0 0 1px rgba(184,242,25,.25) inset; }
    img { width: 88px; height: 88px; border-radius: 50%; }
    h1 { font-size: 24px; margin: 14px 0 6px; }
    p { color: #a9b39a; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 22px; background: #B8F219; color: #0b0d07; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/img/logo-192.png" alt="GDX">
    <h1>You're offline</h1>
    <p>No internet right now. Pages you opened before still work — live auctions, bids and races need a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
