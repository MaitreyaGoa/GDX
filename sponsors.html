<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sponsors, Patrons & Offline Stores — GDX</title>
  <meta name="description" content="The sponsors, patrons and Hot Wheels offline stores backing GDX — Goa Diecast Exchange.">
  <meta name="theme-color" content="#050604">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>try{var t=localStorage.getItem('gdx-theme')||'dark';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/gdx.css">
</head>
<body>
<div id="siteHeader"></div>

<main class="container">
  <div class="gx-crumbs"><a href="index.html">GDX</a> / Sponsors</div>
  <h1 class="page-title" style="margin-top:8px">Sponsors, Patrons &amp; Offline Stores</h1>
  <p class="muted" style="max-width:600px;margin:-8px 0 22px">The people and shops backing Goa's diecast scene. Visit them, buy from them, say GDX sent you.</p>

  <div class="chips sp-tabs" id="tabs">
    <button class="chip active" data-k="">All</button>
    <button class="chip" data-k="sponsor">Sponsors</button>
    <button class="chip" data-k="patron">Patrons</button>
    <button class="chip" data-k="store">Hot Wheels offline stores</button>
  </div>
  <section class="sp-grid" id="list"></section>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async function () {
  const { sb, esc, waLink, C } = window.MHC;
  const list = document.getElementById('list');
  const KIND = { sponsor: 'Sponsor', patron: 'Patron', store: 'Offline store' };
  const ICON = { sponsor: '⭐', patron: '🤝', store: '🏪' };
  let all = [], kind = '';
  const empty = () => `
    <div class="panel sp-empty" style="grid-column:1/-1">
      <div class="big">🤝</div>
      <h2>Partner with GDX</h2>
      <p>Own a toy or hobby store, or want to back Goa's biggest diecast community? Get your logo and business details in front of every collector here.</p>
      <a class="btn btn-primary" href="${esc(waLink('91' + ((C.CONTACTS || [])[0] || {}).phone, 'Hi! I would like to become a GDX sponsor / list my store.'))}" target="_blank" rel="noopener">Become a sponsor</a>
    </div>`;
  function render() {
    const rows = all.filter(s => !kind || s.kind === kind);
    if (!rows.length) { list.innerHTML = empty(); return; }
    list.innerHTML = rows.map(s => {
      const ph = String(s.phone || '').replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
      return `
      <article class="panel sp-card">
        <div class="sp-head">
          <div class="sp-logo">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="${esc(s.name)} logo" loading="lazy">` : ICON[s.kind] || '⭐'}</div>
          <div><div class="sp-kind">${KIND[s.kind] || 'Sponsor'}</div><h3>${esc(s.name)}</h3></div>
        </div>
        ${s.about ? `<p>${esc(s.about)}</p>` : ''}
        ${s.address ? `<p>📍 ${esc(s.address)}</p>` : ''}
        <div class="sp-links">
          ${ph.length === 10 ? `<a href="${esc(waLink('91' + ph, 'Hi! I found you on GDX. '))}" target="_blank" rel="noopener">💬 WhatsApp</a><a href="tel:+91${esc(ph)}">📞 Call</a>` : ''}
          ${s.map_url ? `<a href="${esc(s.map_url)}" target="_blank" rel="noopener">🗺️ Directions</a>` : ''}
          ${s.website ? `<a href="${esc(s.website)}" target="_blank" rel="noopener">🌐 Website</a>` : ''}
        </div>
      </article>`;
    }).join('') + (kind ? '' : empty());
  }
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#tabs .chip').forEach(x => x.classList.toggle('active', x === b));
    kind = b.dataset.k; render();
  });
  try {
    const { data, error } = await sb.from('sponsors').select('*').eq('is_active', true).order('sort').order('created_at');
    if (error) throw error;
    all = data || [];
  } catch (e) { all = []; }
  render();
})();
</script>
</body>
</html>
